version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Maintain Starter Template Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/templates/paper-modern-template"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "gradle"
      - "minecraft"
    ignore:
      # Keep 1.21.x LTS for Java 21; prevent bumping to 26.x which requires Java 25
      - dependency-name: "io.papermc.paper:paper-api"
        update-types: ["version-update:semver-major"]

  # Maintain Root NPM CLI dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
