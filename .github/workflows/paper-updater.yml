name: PaperMC & Minecraft Auto-Updater

on:
  schedule:
    - cron: '0 2 * * 1' # Berjalan otomatis setiap hari Senin pukul 02:00 UTC
  workflow_dispatch:     # Dapat dipicu secara manual kapan saja dari tab Actions

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check PaperMC Fill API & Apply Update
        id: updater
        run: |
          node bin/cli.js check-update --apply

      - name: Verify Compilation of Updated Starter Template
        working-directory: templates/paper-modern-template
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon

      - name: Create Pull Request if Updates Available
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): bump PaperMC and Minecraft version to latest"
          title: "🤖 chore(deps): Automated PaperMC & Minecraft Version Bump"
          body: |
            ### 🚀 Automated PaperMC & Minecraft Update
            
            This automated Pull Request was generated by the **PaperMC & Minecraft Auto-Updater** workflow.
            
            - **Source**: [PaperMC Fill v3 API](https://fill.papermc.io)
            - **Verification**: `./gradlew compileJava` completed successfully with zero errors.
            - **Components Updated**:
              - `templates/paper-modern-template/build.gradle.kts`
              - `templates/paper-modern-template/src/main/resources/paper-plugin.yml`
              - CLI scaffolding defaults
            
            Please review and merge when ready to ensure developers and AI models always scaffold the latest Minecraft & Paper version!
          branch: "automated/paper-version-bump"
          delete-branch: true
          labels: |
            dependencies
            automated-pr
            papermc
