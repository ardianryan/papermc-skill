name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Starter Template Compilation
        working-directory: templates/paper-modern-template
        run: |
          chmod +x gradlew
          ./gradlew compileJava

      - name: Verify NPM Package Structure & CLI
        run: |
          node bin/cli.js --help
          npm pack --dry-run
