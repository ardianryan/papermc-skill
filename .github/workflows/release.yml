name: Automated Release & Publish

on:
  push:
    tags:
      - 'v*' # Triggered on new version tags (e.g. v1.0.0, v1.1.0)
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Releases
      id-token: write # Required for NPM Provenance (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Starter Template Compilation
        working-directory: templates/paper-modern-template
        run: |
          chmod +x gradlew
          ./gradlew compileJava

      - name: Extract Version & Changelog Notes
        id: extract_release
        run: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const version = pkg.version;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");

          // Extract changelog section for the current version
          const escapedVersion = version.replace(/\./g, "\\.");
          const regex = new RegExp(`## \\\\\\[${escapedVersion}\\\\\\][\\s\\S]*?(?=\\n## \\\\\\[|$)`);
          const match = changelog.match(regex);
          
          let releaseNotes = "";
          if (match) {
            // Strip the first header line
            releaseNotes = match[0].replace(/^## \[[^\n]+\n+/, "").trim();
          } else {
            releaseNotes = `Automated release for version ${version}. See CHANGELOG.md for full details.`;
          }

          fs.writeFileSync("RELEASE_NOTES.md", releaseNotes);
          console.log(`Extracted release notes for version ${version}:`);
          console.log(releaseNotes);
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
